name: pipeline

# Hourly: discover → verify → summarise → commit data/ to main. Vercel's Git
# integration builds and deploys every push to main; runs where nothing visible
# changed are committed with "[skip vercel]" (see vercel.json ignoreCommand), so
# the site redeploys only on real changes or every 2 hours (fresh "checked" time).
# Private repo = 2,000 free Actions minutes/month → hourly fits (~1,400 min).
# If the repo is public (unlimited minutes), change the cron to '7,37 * * * *'.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # proves to /api/inbox that this repo's workflow is asking (reader reports)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://protesttracker.vercel.app' }}
      HAS_AI: ${{ secrets.GEMINI_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip until an AI key is configured
        if: env.HAS_AI != 'true'
        run: echo "::notice::Add GEMINI_API_KEY (or ANTHROPIC_API_KEY) as a repo secret to start the pipeline."

      - uses: actions/checkout@v4
        if: env.HAS_AI == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_AI == 'true'
        with:
          node-version: 24
          cache: npm

      - if: env.HAS_AI == 'true'
        run: npm ci --ignore-scripts

      - name: Pipeline
        if: env.HAS_AI == 'true'
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK: ${{ vars.GEMINI_FALLBACK }}
          READER_REPORTS: ${{ vars.READER_REPORTS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node pipeline/run.ts

      - name: Decide whether this commit deploys
        id: gate
        if: env.HAS_AI == 'true'
        run: node scripts/should-deploy.ts

      - name: Commit data to main
        if: env.HAS_AI == 'true'
        run: |
          if [ "${{ steps.gate.outputs.deploy }}" = "true" ]; then
            echo "{\"at\": \"$(date -u +%FT%TZ)\"}" > data/deploy.json
            msg="data: $(date -u +%FT%TZ)"
          else
            msg="data: $(date -u +%FT%TZ) [skip vercel]"
          fi
          # Vercel Hobby only deploys commits authored by the account owner, so the
          # pipeline commits as the repo owner (override with repo variables if needed).
          # Set for the whole step: a rebase onto newer commits needs the identity too.
          git config user.name "${{ vars.COMMIT_NAME || github.repository_owner }}"
          git config user.email "${{ vars.COMMIT_EMAIL || 'swapnil.8723@gmail.com' }}"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -q -m "$msg"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Ping IndexNow
        if: env.HAS_AI == 'true' && steps.gate.outputs.deploy == 'true'
        run: node scripts/indexnow.ts # search engines fetch later; no need to burn 4 billed minutes waiting
