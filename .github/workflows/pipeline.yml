name: pipeline

# Every 3 hours: discover → verify → summarise → translate → commit data/ to main.
# Vercel's Git integration builds and deploys every push to main; runs where nothing
# visible changed are committed with "[skip vercel]" (see vercel.json ignoreCommand).
# Budget: private repo = 2,000 free Actions minutes/month; 8 runs/day × ~6 min ≈ 1,500.
# The pipeline needs no npm packages (plain Node), so there is no install step.
# Hourly would need ~4,000 min: only if the repo goes public (unlimited minutes).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      inbox_url:
        description: 'Reader inbox URL for this run only (testing; leave empty for the live site)'
        required: false
        default: ''

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read # to see whether a run just happened (the Vercel /api/tick backup may have started one)
  id-token: write # proves to /api/inbox that this repo's workflow is asking (reader reports)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://protesttracker.online' }}
      HAS_AI: ${{ secrets.GEMINI_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip until an AI key is configured
        if: env.HAS_AI != 'true'
        run: echo "::notice::Add GEMINI_API_KEY (or ANTHROPIC_API_KEY) as a repo secret to start the pipeline."

      # GitHub's timer and the hourly Vercel /api/tick backup can both fire: run once per
      # window (90 min: a tick-started run covers the GitHub slot that follows it).
      - name: Skip if a run started in the last 90 minutes
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --limit 5 --json databaseId,createdAt             --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].createdAt // empty")
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 5400 ]; then
            echo "Run started at $last; skipping this one."; echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.HAS_AI == 'true' && env.SKIP != 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_AI == 'true' && env.SKIP != 'true'
        with:
          node-version: 24

      - name: Pipeline
        if: env.HAS_AI == 'true' && env.SKIP != 'true'
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK: ${{ vars.GEMINI_FALLBACK }}
          READER_REPORTS: ${{ vars.READER_REPORTS }}
          READER_INBOX_URL: ${{ inputs.inbox_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node pipeline/run.ts

      - name: Decide whether this commit deploys
        id: gate
        if: env.HAS_AI == 'true' && env.SKIP != 'true'
        run: node scripts/should-deploy.ts

      - name: Commit data to main
        if: env.HAS_AI == 'true' && env.SKIP != 'true'
        run: |
          if [ "${{ steps.gate.outputs.deploy }}" = "true" ]; then
            echo "{\"at\": \"$(date -u +%FT%TZ)\"}" > data/deploy.json
            msg="data: $(date -u +%FT%TZ)"
          else
            msg="data: $(date -u +%FT%TZ) [skip vercel]"
          fi
          # Vercel Hobby only deploys commits authored by the account owner, so the
          # pipeline commits as the repo owner (override with repo variables if needed).
          # Set for the whole step: a rebase onto newer commits needs the identity too.
          git config user.name "${{ vars.COMMIT_NAME || github.repository_owner }}"
          git config user.email "${{ vars.COMMIT_EMAIL || 'swapnil.8723@gmail.com' }}"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -q -m "$msg"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Ping IndexNow
        if: env.HAS_AI == 'true' && env.SKIP != 'true' && steps.gate.outputs.deploy == 'true'
        run: node scripts/indexnow.ts # search engines fetch later; no need to burn 4 billed minutes waiting
