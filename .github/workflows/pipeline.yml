name: pipeline

# Every 30 minutes: discover → verify → summarise → build → deploy.
# Offset from :00/:30 because GitHub's scheduler is busiest on the hour.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Force a deploy even if nothing changed
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://protesttracker.online' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch into ./data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir data && git -C data init -b data
            git -C data remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore rendered share cards
        uses: actions/cache@v4
        with:
          path: .cache/cards
          key: cards-${{ github.run_id }}
          restore-keys: cards-

      - name: Pipeline
        if: github.event_name != 'push'
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node pipeline/run.ts

      - name: Decide whether to deploy
        id: gate
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'push' || inputs.deploy }}
        run: node scripts/should-deploy.ts

      - name: Build
        if: steps.gate.outputs.deploy == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT || 'loud' }}" --branch=main --commit-dirty=true
          echo "{\"at\": \"$(date -u +%FT%TZ)\"}" > data/deploy.json

      - name: Ping IndexNow
        if: steps.gate.outputs.deploy == 'true'
        run: node scripts/indexnow.ts

      - name: Commit data
        if: always()
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git -c user.name="loud-pipeline" -c user.email="pipeline@users.noreply.github.com" commit -q -m "data $(date -u +%FT%TZ)"
          git push -q origin data
